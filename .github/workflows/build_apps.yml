name: Build Money Book (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build Android APK (Ubuntu — faster)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-shrink

      - name: Rename & stage APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Money_Book.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Money_Book_Android_APK
          path: Money_Book.apk
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2: Build iOS IPA (macOS — required)
  # ─────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Money_Book.app
          zip -r Money_Book.ipa Payload
          echo "IPA created successfully!"
          ls -lh Money_Book.ipa

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Money_Book_iOS_IPA
          path: Money_Book.ipa
          retention-days: 30
